[package]
name = "datalevin-codec"
version = "0.1.0"
edition = "2024"
publish = false
description = "Platform-neutral codecs shared by Datalevin runtimes"
license = "EPL-2.0"

[lib]
name = "datalevin_codec"
path = "src/lib.rs"

[dependencies]
roaring = "0.11.5"
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
snap = "1.1"
zstd = { version = "0.13", default-features = false }
xz2 = "0.1"

[dev-dependencies]
proptest = "1.11.0"
