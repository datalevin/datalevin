name: Build

# on: push
# on: workflow_dispatch
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag whose binary asset should be rebuilt
        required: true
        type: string
      runner:
        description: Platform asset to rebuild
        required: true
        default: macos-14
        type: choice
        options:
          - macos-14
          - ubuntu-22.04
          - ubuntu-24.04-arm
          - windows-latest
      macos_runner:
        description: Machine to use for a macOS rebuild
        required: true
        default: self-hosted
        type: choice
        options:
          - self-hosted
          - github-hosted
  release:
    types:
      - created

permissions:
  contents: write

jobs:
  build:
    # runs-on: ${{ matrix.os }}
    # Runner labels select build machines; release filenames use stable OS names.
    runs-on: ${{ matrix.os == 'macos-14' && (github.event_name == 'release' || inputs.macos_runner == 'self-hosted') && fromJSON('["self-hosted","macOS","ARM64","datalevin-release"]') || matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-14' && 180 || 360 }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
      # RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag || github.sha }}
      RELEASE_OS: ${{ matrix.os == 'macos-14' && 'macos' || matrix.os == 'windows-latest' && 'windows' || 'linux' }}
      RELEASE_ARCH: ${{ contains(fromJSON('["macos-14","ubuntu-24.04-arm"]'), matrix.os) && 'aarch64' || 'amd64' }}
      # The local Mac runs a newer OS than the minimum supported release target.
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.os == 'macos-14' && '14.0' || '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('{{"os":["{0}"]}}', inputs.runner) || '{"os":["macos-14","ubuntu-22.04","ubuntu-24.04-arm","windows-latest"]}') }}
      # matrix:
      #   os:
      #     # - macos-14
      #     # - ubuntu-22.04
      #     # - ubuntu-24.04-arm
      #     - windows-latest

    steps:
      - name: Set binary asset name
        shell: bash
        run: echo "RELEASE_ASSET=dtlv-${RELEASE_TAG}-${RELEASE_OS}-${RELEASE_ARCH}.zip" >> "$GITHUB_ENV"

      - name: Checkout repository and submodules
        uses: actions/checkout@v3
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive
          persist-credentials: false

      - name: Get Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Lein
        uses: knicknic/os-specific-run@v1.0.3
        with:
          macos: |
            for formula in leiningen libomp llvm gh sevenzip; do
              if ! brew list --versions "$formula" >/dev/null 2>&1; then
                brew install "$formula"
              fi
            done
          linux: |
            sudo apt-get update
            sudo apt-get install -y gcc-12 g++-12 zlib1g-dev
            curl -O https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein
            chmod a+x lein
            sudo mv lein /usr/local/bin/
          windows: |
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein.bat" -OutFile "lein.bat"
            .\lein.bat self-install

      - name: Run Tests then Uberjar
        uses: knicknic/os-specific-run@v1.0.3
        with:
          macos: |
            lein uberjar
            echo "Generated JAR files:"
            ls -l target/*.jar
          linux: |
            lein uberjar
            echo "Generated JAR files:"
            ls -l target/*.jar
          windows: |
            .\lein.bat run
            .\lein.bat uberjar
            echo "Generated JAR files:"
            dir target\*.jar

      - name: Upload Uberjar
        if: github.event_name == 'release' && matrix.os == 'ubuntu-22.04'
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: target/datalevin-${{ github.event.release.tag_name }}-standalone.jar
          overwrite: true

      - name: Setup Graalvm
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Visual Studio shell
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Native Datalevin (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          export DTLV_OS=${{ env.RELEASE_OS }}
          export DTLV_ARCH=${{ env.RELEASE_ARCH }}


          if [ "${{ runner.os }}" == "macOS" ]; then
            # Manual rebuilds use the release tag's script, so override its
            # default application watchdog here as well.
            export NATIVE_IMAGE_OPTIONS="-H:DeadlockWatchdogInterval=60 -H:NativeLinkerOption=-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}"
            caffeinate -i bash script/compile-native
          else
            bash script/compile-native-linux
          fi

      - name: Build Native Datalevin (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          call script\compile-native.bat

      - name: Run Native Tests
        if: matrix.os != 'windows-latest'
        run: ./dtlv-test0

      - name: Check macOS deployment target
        if: matrix.os == 'macos-14'
        run: |
          xcrun vtool -show-build dtlv
          minos=$(xcrun vtool -show-build dtlv | awk '/minos/ { print $2; exit }')
          if [ -z "$minos" ] || [ "${minos%%.*}" -gt 14 ]; then
            echo "Binary requires macOS ${minos:-unknown}; expected macOS 14 or earlier."
            exit 1
          fi

      - name: Zip Binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          if [ "${{ runner.os }}" == "macOS" ]; then
            7zz a -tzip "$RELEASE_ASSET" dtlv
          else
            7z a -tzip "$RELEASE_ASSET" dtlv
          fi

      - name: Zip Binary (Windows)
        if: matrix.os == 'windows-latest'
        run: 7z a -tzip "$env:RELEASE_ASSET" dtlv.exe

      - name: Upload Binary
        if: github.event_name == 'release'
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ${{ env.RELEASE_ASSET }}
          overwrite: true

      - name: Replace Binary on Existing Release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "$RELEASE_ASSET" --clobber
