name: Build

# on: push
# on: workflow_dispatch
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag whose macOS asset should be rebuilt
        required: true
        type: string
  release:
    types:
      - created

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
    strategy:
      matrix: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '{"include":[{"os":"macos-14","arch":"aarch64"}]}' || '{"include":[{"os":"macos-14","arch":"aarch64"},{"os":"ubuntu-22.04","arch":"amd64"},{"os":"ubuntu-24.04-arm","arch":"aarch64"},{"os":"windows-latest","arch":"amd64"}]}') }}

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v3
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive

      - name: Get Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Lein
        uses: knicknic/os-specific-run@v1.0.3
        with:
          macos: |
            brew install leiningen libomp llvm
          linux: |
            sudo apt-get update
            sudo apt-get install -y gcc-12 g++-12 zlib1g-dev
            curl -O https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein
            chmod a+x lein
            sudo mv lein /usr/local/bin/
          windows: |
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein.bat" -OutFile "lein.bat"
            .\lein.bat self-install

      - name: Run Tests then Uberjar
        uses: knicknic/os-specific-run@v1.0.3
        with:
          macos: |
            lein uberjar
            echo "Generated JAR files:"
            ls -l target/*.jar
          linux: |
            lein uberjar
            echo "Generated JAR files:"
            ls -l target/*.jar
          windows: |
            .\lein.bat run
            .\lein.bat uberjar
            echo "Generated JAR files:"
            dir target\*.jar

      - name: Upload Uberjar
        if: github.event_name == 'release' && matrix.os == 'ubuntu-22.04'
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: target/datalevin-${{ github.event.release.tag_name }}-standalone.jar
          overwrite: true

      - name: Setup Graalvm
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Visual Studio shell
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Native Datalevin (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          export DTLV_OS=${{ runner.os == 'macOS' && 'macos' || 'linux' }}
          export DTLV_ARCH=${{ matrix.arch }}
          if [ "${{ runner.os }}" == "macOS" ]; then
            bash script/compile-native
          else
            bash script/compile-native-linux
          fi

      - name: Build Native Datalevin (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          call script\compile-native.bat

      - name: Run Native Tests
        if: matrix.os != 'windows-latest'
        run: ./dtlv-test0

      - name: Zip Binary (Unix)
        if: matrix.os != 'windows-latest'
        run: 7z a -tzip dtlv-${{ env.RELEASE_TAG }}-${{ matrix.os }}-${{ matrix.arch }}.zip dtlv

      - name: Zip Binary (Windows)
        if: matrix.os == 'windows-latest'
        run: 7z a -tzip dtlv-${{ env.RELEASE_TAG }}-${{ matrix.os }}-${{ matrix.arch }}.zip dtlv.exe

      - name: Upload Binary
        if: github.event_name == 'release'
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: dtlv-${{ env.RELEASE_TAG }}-${{ matrix.os }}-${{ matrix.arch }}.zip
          overwrite: true

      - name: Replace Binary on Existing Release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "dtlv-${RELEASE_TAG}-${{ matrix.os }}-${{ matrix.arch }}.zip" --clobber
