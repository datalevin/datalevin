<title id="title">Running Datalog query and its entity-star graph</title>
<desc id="desc">Three panels show a Datomic-flavored Datalog query, its triple patterns grouped into three entity stars with attributes and a year constraint, and the simplified three-node query graph. Stored references point from the movie-company star to the title and company stars, while indexes permit traversal in reverse.</desc>
<metadata >Generated by scripts/generate_figures.py for the CIDR paper.</metadata>
